name: LayerLens
options:
  bundleIdPrefix: com.layerlens
  deploymentTarget:
    macOS: "14.0"
configs:
  Debug: debug
  Release: release
targets:
  LayerLens:
    type: application
    platform: macOS
    sources:
      - path: LayerLens
      # 网页以文件夹形式打进 Resources/Web
      - path: ../Web
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: LayerLens
        PRODUCT_BUNDLE_IDENTIFIER: com.layerlens.mac
        MARKETING_VERSION: "0.6.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: LayerLens/Info.plist
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: LayerLens/LayerLens.entitlements
