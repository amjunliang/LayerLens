<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayerLens</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/app.css">
<script>
  // 首次绘制前应用保存的主题, 避免先显示默认主题再切换
  try {
    var theme = localStorage.getItem('layerlens_theme');
    if (theme && theme !== 'auto') document.documentElement.dataset.theme = theme;
  } catch (e) {}
</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
    <symbol id="i-keyboard" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></symbol>
    <symbol id="i-focus" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M4 8V4h4M20 8V4h-4M4 16v4h4M20 16v4h-4"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><path d="M5 4v14h5M5 9h5"/><rect x="12" y="6" width="8" height="5" rx="1"/><rect x="12" y="15" width="8" height="5" rx="1"/></symbol>
    <symbol id="i-device" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-chevron-up" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="1.5"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 9.5V20h12V9.5"/></symbol>
    <symbol id="i-switcher" viewBox="0 0 24 24"><rect x="8" y="5" width="9" height="14" rx="2"/><path d="M5 7.5v9M20 7.5v9"/></symbol>
    <symbol id="i-rotate" viewBox="0 0 24 24"><rect x="9" y="8" width="11" height="13" rx="2"/><path d="M4 11V8a4 4 0 0 1 4-4h3"/><path d="M9 2l2 2-2 2"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></symbol>
    <symbol id="i-inspect" viewBox="0 0 24 24"><path d="M10 3H5a2 2 0 0 0-2 2v5M3 14v5a2 2 0 0 0 2 2h5M14 3h5a2 2 0 0 1 2 2v5"/><path d="M12 12l9 3.2-4 1.3-1.3 4z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
    <symbol id="i-sidebar" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></symbol>
    <symbol id="i-sidebar-left" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></symbol>
    <symbol id="i-picker" viewBox="0 0 24 24"><path d="M2 22l1-1h3l9-9"/><path d="M3 21v-3l9-9"/><path d="M15 6l3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4z"/></symbol>
    <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></symbol>
    <symbol id="i-wrap" viewBox="0 0 24 24"><path d="M4 6h16M4 12h13a3 3 0 0 1 0 6h-4"/><path d="M15 16l-2 2 2 2M4 18h5"/></symbol>
    <symbol id="i-to-top" viewBox="0 0 24 24"><path d="M5 4h14M12 20V8M7 13l5-5 5 5"/></symbol>
    <symbol id="i-to-bottom" viewBox="0 0 24 24"><path d="M5 20h14M12 4v12M7 11l5 5 5-5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
    <symbol id="i-maximize" viewBox="0 0 24 24"><path d="M14 4h6v6M10 20H4v-6M20 4l-7 7M4 20l7-7"/></symbol>
    <symbol id="i-minimize" viewBox="0 0 24 24"><path d="M4 14h6v6M20 10h-6V4M10 14l-7 7M14 10l7-7"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.6 5a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8z" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
    <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-dock" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M4 14h16"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01" stroke-width="3"/></symbol>
  </defs>
</svg>

<header class="toolbar">
  <div class="toolbar-left">
    <button class="icon-btn toggle on" id="treeToggle" title="层级面板 (T)" aria-label="层级面板" aria-pressed="true"><svg class="icon"><use href="#i-sidebar-left"/></svg></button>
    <div class="popover-anchor">
      <button class="target-btn" id="targetBtn" title="切换设备 / App"><span class="status-dot" id="statusDot" title="未连接"></span><span class="app-name" id="appName">LayerLens</span><svg class="icon target-caret"><use href="#i-chevron"/></svg></button>
      <div class="popover menu target-menu" id="targetMenu" hidden></div>
    </div>
    <span class="app-meta" id="appMeta"></span>
  </div>
  <div class="toolbar-center">
    <div class="segmented" id="modeSeg">
      <button data-mode="live" id="liveModeBtn" title="模拟器实时画面" hidden>实时</button>
      <button data-mode="2d" class="active">2D</button>
      <button data-mode="3d">3D</button>
    </div>
    <div class="toolbar-actions">
      <button class="icon-btn has-live-only" id="xcodeRun" title="在 Xcode 中运行" aria-label="在 Xcode 中运行"><svg class="icon"><use href="#i-play"/></svg></button>
      <button class="icon-btn" id="refreshBtn" title="刷新 (R)" aria-label="刷新"><svg class="icon"><use href="#i-refresh"/></svg></button>
    </div>
  </div>
  <div class="toolbar-right">
    <div class="popover-anchor help-anchor">
      <button class="icon-btn" id="helpBtn" title="快捷键 (?)" aria-label="快捷键"><svg class="icon"><use href="#i-keyboard"/></svg></button>
    </div>
    <button class="icon-btn" id="sandboxBtn" title="沙盒文件" aria-label="沙盒文件"><svg class="icon"><use href="#i-folder"/></svg></button>
    <button class="icon-btn toggle" id="logToggle" title="日志与网络面板 (L / N)" aria-label="日志与网络面板" aria-pressed="false"><svg class="icon"><use href="#i-terminal"/></svg></button>
    <button class="icon-btn toggle on" id="detailToggle" title="详情面板 (D)" aria-label="详情面板" aria-pressed="true"><svg class="icon"><use href="#i-sidebar"/></svg></button>
  </div>
</header>

<div class="popover-anchor event-anchor"><div class="popover event-pop" id="eventPop" hidden></div></div>

<main class="layout" id="layout">
  <section class="pane tree-pane">
    <div class="pane-header">
      <label class="search-box">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="search" type="search" placeholder="搜索类名 / 地址 / ivar">
      </label>
      <div class="popover-anchor">
        <button class="icon-btn" id="treeFilterBtn" title="筛选" aria-label="筛选"><svg class="icon"><use href="#i-filter"/></svg></button>
        <div class="popover menu filter-pop" id="treeFilterPop" hidden>
          <label class="menu-row"><span>显示 CALayer</span><input type="checkbox" id="showLayers"></label>
          <label class="menu-row"><span>显示隐藏视图</span><input type="checkbox" id="showHidden" checked></label>
        </div>
      </div>
    </div>
    <div class="tree" id="tree"></div>
  </section>

  <div class="splitter vertical" data-split="s1"></div>

  <section class="pane canvas-pane" id="canvasPane">
    <div class="crumbs" id="crumbs"></div>
    <div class="canvas-float">
      <div class="float-group live-only">
        <button class="icon-btn toggle" id="liveInspect" title="选择元素 (按住 ⌥ 点击)" aria-label="选择元素" aria-pressed="false"><svg class="icon"><use href="#i-inspect"/></svg></button>
        <button class="icon-btn" id="liveHome" title="Home" aria-label="Home"><svg class="icon"><use href="#i-home"/></svg></button>
        <button class="icon-btn" id="liveSwitcher" title="多任务" aria-label="多任务"><svg class="icon"><use href="#i-switcher"/></svg></button>
        <button class="icon-btn" id="liveRotate" title="向左旋转" aria-label="向左旋转"><svg class="icon"><use href="#i-rotate"/></svg></button>
      </div>
      <div class="float-group">
        <button class="icon-btn" id="zoomFit" title="适应窗口" aria-label="适应窗口"><svg class="icon"><use href="#i-fit"/></svg></button>
        <button class="icon-btn flat-only toggle" id="colorPick" title="取色 (C)" aria-label="取色" aria-pressed="false"><svg class="icon"><use href="#i-picker"/></svg></button>
        <button class="icon-btn three-only toggle" id="subtreeOnly" title="只看选中子树" aria-label="只看选中子树" aria-pressed="false"><svg class="icon"><use href="#i-focus"/></svg></button>
      </div>
      <div class="float-group three-only">
        <div class="popover-anchor">
          <button class="icon-btn" id="spacingBtn" title="层间距" aria-label="层间距"><svg class="icon"><use href="#i-layers"/></svg></button>
          <div class="popover spacing-pop" id="spacingPop" hidden>
            <span>层间距</span>
            <input type="range" id="spacing" min="0" max="60" value="16">
            <span class="zoom-label" id="spacingLabel">16</span>
          </div>
        </div>
        <button class="icon-btn toggle on" id="showImages" title="截图" aria-label="截图" aria-pressed="true"><svg class="icon"><use href="#i-image"/></svg></button>
      </div>
    </div>
    <div class="stage-wrap" id="stageWrap">
      <div class="stage" id="stage"></div>
    </div>
    <div class="hover-tip" id="hoverTip" hidden></div>
    <div class="loupe" id="loupe" hidden>
      <canvas class="loupe-canvas" id="loupeCanvas"></canvas>
      <div class="loupe-info"><span class="loupe-swatch" id="loupeSwatch"></span><span class="loupe-hex" id="loupeHex"></span><span class="loupe-rgb" id="loupeRgb"></span></div>
    </div>
    <div class="app-banner" id="appBanner" hidden>
      <span class="app-banner-text" id="appBannerText"></span>
      <button class="app-banner-link" id="appBannerLink" hidden></button>
      <button class="app-banner-run" id="appBannerRun" hidden>运行</button>
    </div>
    <div class="app-banner live-only" id="liveHeal" hidden>
      <span class="app-banner-text" id="liveHealText"></span>
      <button class="app-banner-run" id="liveHealBtn">修复</button>
      <button class="app-banner-link" id="liveHealClose">忽略</button>
    </div>
    <div class="empty-state" id="emptyState" hidden>
      <svg class="empty-icon"><use href="#i-device"/></svg>
      <div class="empty-title" id="emptyTitle"></div>
      <div class="empty-body" id="emptyBody"></div>
      <div class="guide" id="emptyGuide" hidden></div>
      <button class="empty-action" id="emptyIntegration" data-panel="integration">查看集成说明</button>
    </div>
    <div class="live-wrap" id="liveWrap" hidden>
      <canvas class="live-canvas" id="liveCanvas" tabindex="0"></canvas>
      <div class="live-guide" id="liveGuide" hidden>
        <div class="live-guide-title" id="liveGuideTitle">正在连接实时画面…</div>
        <div class="live-note live-error" id="liveError" hidden></div>
        <div class="live-waiting" id="liveWaiting">正在等待连接…</div>
      </div>
    </div>
  </section>

  <div class="splitter horizontal" data-split="s4"></div>

  <section class="pane log-pane" id="logPane" data-tab="log">
    <div class="log-head">
      <div class="segmented small pane-tabs" id="paneTabs">
        <button data-pane="log" class="active">日志</button>
        <button data-pane="net">网络</button>
        <button data-pane="git">改动</button>
      </div>
      <label class="search-box log-search log-only" id="logSearch">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="logFilter" type="search" placeholder="过滤, 多个关键词用 | 分隔, 以 \ 开头为正则" spellcheck="false" autocomplete="off">
      </label>
      <span class="log-count log-only" id="logCount"></span>
      <div class="log-source log-only" id="logSource" hidden>
        <span class="log-source-name" id="logSourceName"></span>
        <button class="log-source-back" id="logBackLive">返回实时日志</button>
      </div>
      <button class="icon-btn toggle log-only" id="logWrap" title="换行" aria-label="换行" aria-pressed="false"><svg class="icon"><use href="#i-wrap"/></svg></button>
      <button class="icon-btn log-only" id="logTop" title="跳到顶部" aria-label="跳到顶部"><svg class="icon"><use href="#i-to-top"/></svg></button>
      <button class="icon-btn log-only" id="logBottom" title="跳到底部, 跟随最新" aria-label="跳到底部"><svg class="icon"><use href="#i-to-bottom"/></svg></button>
      <button class="icon-btn log-only" id="logClear" title="清空" aria-label="清空"><svg class="icon"><use href="#i-trash"/></svg></button>
      <label class="search-box log-search net-only" id="netSearch">
        <svg class="icon"><use href="#i-search"/></svg>
        <input id="netFilter" type="search" placeholder="过滤地址, 方法, 状态码或内容, 多个关键词用 | 分隔" spellcheck="false" autocomplete="off">
      </label>
      <select id="netType" class="net-type net-only" aria-label="类型">
        <option value="">全部</option>
        <option value="json">JSON</option>
        <option value="image">图片</option>
        <option value="doc">文档</option>
        <option value="other">其他</option>
        <option value="failed">失败</option>
      </select>
      <span class="log-count net-only" id="netCount"></span>
      <button class="icon-btn toggle net-only" id="netPause" title="暂停" aria-label="暂停" aria-pressed="false"><svg class="icon"><use href="#i-pause"/></svg></button>
      <button class="icon-btn net-only" id="netHar" title="导出 HAR" aria-label="导出 HAR"><svg class="icon"><use href="#i-download"/></svg></button>
      <button class="icon-btn net-only" id="netClear" title="清空" aria-label="清空"><svg class="icon"><use href="#i-trash"/></svg></button>
      <span class="git-repo git-only" id="gitRepo"></span>
      <span class="git-branch git-only" id="gitBranch"></span>
      <span class="log-count git-only" id="gitSync"></span>
      <button class="icon-btn git-only" id="gitTreeMode" title="树形显示" aria-label="树形显示"><svg class="icon"><use href="#i-tree"/></svg></button>
      <button class="icon-btn git-only" id="gitPull" title="拉取 (仅快进)" aria-label="拉取"><svg class="icon"><use href="#i-download"/></svg></button>
      <button class="icon-btn git-only" id="gitPush" title="推送" aria-label="推送"><svg class="icon"><use href="#i-upload"/></svg></button>
      <button class="icon-btn" id="logMax" title="最大化" aria-label="最大化"><svg class="icon"><use href="#i-maximize"/></svg></button>
      <button class="icon-btn" id="logPopout" title="在独立窗口打开" aria-label="在独立窗口打开"><svg class="icon"><use href="#i-external"/></svg></button>
      <button class="icon-btn" id="logDock" title="停靠回主窗口" aria-label="停靠回主窗口"><svg class="icon"><use href="#i-dock"/></svg></button>
      <div class="popover-anchor log-only">
        <button class="icon-btn" id="logMore" title="更多" aria-label="更多"><svg class="icon"><use href="#i-more"/></svg></button>
        <div class="popover menu log-menu" id="logMenu" hidden>
          <div class="menu-row"><span>字体</span><select id="logFont" class="log-font-select"></select></div>
          <div class="menu-row"><span>字号</span><span class="log-size"><button id="logSizeDown" aria-label="减小字号">−</button><span id="logSizeLabel">12</span><button id="logSizeUp" aria-label="增大字号">+</button></span></div>
          <div class="menu-sep"></div>
          <button class="menu-row menu-action" id="logCopy">复制选中行</button>
          <button class="menu-row menu-action" id="logExportAll">导出全部</button>
          <button class="menu-row menu-action" id="logExportView">导出过滤结果</button>
          <div class="menu-sep"></div>
          <button class="menu-row menu-action" id="logDeviceFiles">设备日志文件…</button>
          <button class="menu-row menu-action" id="logOpenFile">打开本地文件…</button>
          <button class="menu-row menu-action" id="logReveal">在访达中显示</button>
        </div>
      </div>
      <button class="icon-btn" id="logClose" title="关闭 (L)" aria-label="关闭"><svg class="icon"><use href="#i-close"/></svg></button>
      <input type="file" id="logFileInput" accept=".log,.txt,text/plain" hidden>
    </div>
    <div class="log-body log-only">
      <div class="log-list" id="logList" tabindex="0">
        <div class="log-spacer" id="logSpacer"></div>
        <div class="log-rows" id="logRows"></div>
      </div>
      <div class="log-empty" id="logEmpty" hidden></div>
      <button class="log-new" id="logNew" hidden>新日志 ↓</button>
    </div>
    <div class="log-detail log-only" id="logDetail" hidden></div>
    <div class="net-body net-only" id="netBody">
      <div class="net-main">
        <div class="net-list" id="netList" tabindex="0">
          <div class="net-cols">
            <span class="net-start">时间</span><span class="net-method">方法</span><span class="net-status">状态</span><span class="net-size">大小</span><span class="net-time">耗时</span><span class="net-host">域名</span><span class="net-path">路径</span><span class="net-kind">类型</span>
          </div>
          <div class="log-spacer" id="netSpacer"></div>
          <div class="log-rows" id="netRows"></div>
        </div>
        <div class="log-empty" id="netEmpty" hidden></div>
      </div>
      <div class="net-splitter" id="netSplitter" hidden></div>
      <div class="net-detail" id="netDetail" hidden></div>
    </div>
    <div class="git-body git-only" id="gitBody">
      <div class="git-side">
        <div class="git-files" id="gitFiles"></div>
        <div class="git-commit" id="gitCommitBox">
          <div class="git-amend-warn" id="gitAmendWarn" hidden>上一次提交已推送, 修改后需要强制推送</div>
          <div class="git-commit-row">
            <textarea id="gitMessage" rows="1" placeholder="提交说明, ⌘↩ 提交" spellcheck="false"></textarea>
            <label class="git-amend" title="修改上次提交"><input type="checkbox" class="git-check" id="gitAmend"> <span>修改上次</span></label>
            <button class="primary" id="gitCommit">提交</button>
          </div>
        </div>
      </div>
      <div class="net-splitter git-splitter" id="gitSplitter"></div>
      <div class="git-diff" id="gitDiff"></div>
      <div class="log-empty" id="gitEmpty" hidden></div>
    </div>
  </section>

  <div class="splitter vertical" data-split="s2"></div>
  <div class="splitter horizontal" data-split="s3"></div>

  <section class="pane detail-pane">
    <div class="pane-header">
      <div class="segmented full" id="detailTabs">
